name: Verify portfolio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
      - run: node scripts/build.mjs
      - run: test -z "$(git status --porcelain -- dist)"
      - run: node scripts/check-browser.mjs
      - run: node scripts/check-transitions.mjs
